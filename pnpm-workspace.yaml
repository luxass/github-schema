ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  # Remove these when TS has been out for longer time
  - typescript
  - "@typescript/typescript-*"

overrides:
  undici-types: 7.30.1
  "@graphql-tools/executor-http": 3.4.1
  "@graphql-tools/executor-graphql-ws": 3.2.0
  semver: 7.8.5

catalogs:
  dev:
    oxfmt: 0.73.0
    oxlint: 1.76.0
    oxlint-tsgolint: 7.0.2004
    publint: 0.3.25
    tsdown: 0.23.1
    typescript: 7.0.2

  graphql:
    "@graphql-codegen/add": 7.1.1
    "@graphql-codegen/cli": 7.4.6
    "@graphql-codegen/typescript": 6.1.2
    graphql: 17.0.2
    graphql-tag: 2.12.7

  peer:
    graphql: ">=17.0.2"
    graphql-tag: ">=2.12.7"

  types:
    "@types/node": 26.6.5
