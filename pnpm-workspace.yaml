ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  # Remove these when TS has been out for longer time
  - typescript
  - "@typescript/typescript-*"

overrides:
  undici-types: 7.16.0
  "@graphql-tools/executor-http": 3.3.0
  "@graphql-tools/executor-graphql-ws": 3.1.5
  semver: 7.8.1

catalogs:
  dev:
    oxfmt: 0.61.0
    oxlint: 1.76.0
    oxlint-tsgolint: 7.0.2001
    publint: 0.3.22
    tsdown: 0.22.14
    typescript: 7.0.2

  graphql:
    "@graphql-codegen/add": 7.1.0
    "@graphql-codegen/cli": 7.2.0
    "@graphql-codegen/typescript": 6.1.0
    graphql: 17.0.2
    graphql-tag: 2.12.7

  peer:
    graphql: ">=17.0.2"
    graphql-tag: ">=2.12.7"

  types:
    "@types/node": 26.1.2
