name: Release

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Commit SHA prepared by Auto Release (optional for manual recovery)
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-staged-release
  cancel-in-progress: false

jobs:
  release:
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged.yaml@10298e06aecc428b39ef4121636400396b53a1fa # v0.16.0
    permissions:
      contents: write
      id-token: write
    with:
      expected-sha: ${{ inputs.expected-sha }}
