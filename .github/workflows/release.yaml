name: Release

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Commit SHA prepared by Auto Release (optional for manual recovery)
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-staged-release
  cancel-in-progress: false

jobs:
  release:
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
    permissions:
      contents: write
      id-token: write
    with:
      expected-sha: ${{ inputs.expected-sha }}
