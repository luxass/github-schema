name: Release

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Commit SHA prepared by Auto Release (optional for manual recovery)
        type: string
        required: false

permissions: {}

jobs:
  release:
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged.yaml@0431feae72d899911e3d13270225d83152d59f5d # shared-workflows PR #85
    permissions:
      contents: write
      id-token: write
    with:
      expected-sha: ${{ inputs.expected-sha }}
