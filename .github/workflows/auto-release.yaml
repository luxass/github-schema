name: Auto Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - github-schema.graphql
      - src/github-schema.ts

# Releases bump the version on main, so they must never run in parallel.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions: {}

jobs:
  auto-release:
    name: auto release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # bumpp pushes the version commit and tag (with the GitHub App token)
    environment:
      name: huginn
      deployment: false
    if: |
      github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'update-github-graphql-schema'
      && github.repository == 'luxass/github-schema' && (github.event.pull_request.user.login == 'luxass' || github.event.pull_request.user.login == 'huginn-watch[bot]')
    steps:
      - name: require complete PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [[ "${PR_TITLE,,}" == *"[incomplete]"* || "$PR_BODY" == *"<!-- pr-metadata:incomplete -->"* ]]; then
            echo "::error::This update is incomplete. Correct the PR title and summary and remove the incomplete markers before merging."
            exit 1
          fi

      - name: generate token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          repositories: luxass/github-schema
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: install dependencies
        run: pnpm install

      - name: build
        run: pnpm run build

      - name: create tag and release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          IFS='.' read -r MAJOR MINOR PATCH <<< "$(jq -r '.version' package.json)"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          # Use the reviewed PR title, including any manual correction after an AI failure.
          if [[ "$PR_TITLE" =~ ^feat(\(.+\))?: ]]; then
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          fi

          git config user.email "273299945+huginn-watch[bot]@users.noreply.github.com"
          git config user.name "huginn-watch[bot]"

          npx bumpp "$NEW_VERSION" --commit --tag --push --yes
