name: Auto Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - github-schema.graphql
      - src/github-schema.ts

# Releases bump the version on main, so they must never run in parallel.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions: {}

jobs:
  auto-release:
    name: auto release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the GitHub App token pushes the version commit
    environment:
      name: huginn
      deployment: false
    if: |
      github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'update-github-graphql-schema'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.repository == 'luxass/github-schema' && (github.event.pull_request.user.login == 'luxass' || github.event.pull_request.user.login == 'huginn-watch[bot]')
    steps:
      - name: require complete PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [[ "${PR_TITLE,,}" == *"[incomplete]"* || "$PR_BODY" == *"<!-- pr-metadata:incomplete -->"* ]]; then
            echo "::error::This update is incomplete. Correct the PR title and summary and remove the incomplete markers before merging."
            exit 1
          fi

      - name: generate token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true # required to push the version commit
          token: ${{ steps.app-token.outputs.token }}

      - name: prepare the version and dispatch the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$MERGE_SHA" HEAD
          current_version=$(jq -er '.version | strings' package.json)
          trailer="Schema-Update-PR: $PR_NUMBER"
          prepared_sha=$(git log -1 --format=%H --grep="^$trailer$" "$MERGE_SHA..HEAD" -- package.json)

          if [[ -n "$prepared_sha" ]]; then
            # A failed dispatch can be retried without bumping the version again.
            if [[ "$prepared_sha" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::The prepared release commit is no longer at main. Review the current version before dispatching."
              exit 1
            fi
            if gh release view "v$current_version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx false; then
              echo "v$current_version already has a published GitHub release."
              exit 0
            fi
          else
            # Do not prepare another version while a release still needs approval.
            if ! gh release view "v$current_version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx false; then
              echo "::error::Finish the release for v$current_version, then rerun this workflow."
              exit 1
            fi
            if [[ ! "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Expected a stable package version in package.json."
              exit 1
            fi
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            next_version="$major.$minor.$((patch + 1))"
            if [[ "$PR_TITLE" =~ ^feat(\(.+\))?: ]]; then
              next_version="$major.$((minor + 1)).0"
            fi

            jq --arg version "$next_version" '.version = $version' package.json > "$RUNNER_TEMP/package.json"
            mv "$RUNNER_TEMP/package.json" package.json
            git config user.email "273299945+huginn-watch[bot]@users.noreply.github.com"
            git config user.name "huginn-watch[bot]"
            git add -- package.json
            git commit -m "chore: release v$next_version" -m "$trailer"
            prepared_sha=$(git rev-parse HEAD)
            git push origin HEAD:refs/heads/main
          fi

          gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref main -f "expected-sha=$prepared_sha"
